name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # One version failing shouldn't hide whether the others pass - the
      # useful signal is which of them broke, not that something did.
      fail-fast: false
      matrix:
        # Every stable CPython this package supports; `requires-python`
        # in pyproject.toml sets the floor.
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Cache embedding models
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/huggingface
          # Keyed by the fastembed model name(s) this project uses, so a
          # model change busts the cache instead of silently reusing a
          # stale download; the network fetch then happens once per model
          # version, not once per test run.
          key: huggingface-BAAI-bge-small-en-v1.5

      # Lint and format results don't vary by interpreter, so running
      # this on every matrix leg would just triple the wall clock.
      - name: Pre-commit hooks
        if: matrix.python-version == '3.12'
        run: uv run pre-commit run --all-files

      # The MCP Apps `ui://` view render tests (tests/test_mcp_ui_views.py)
      # need headless Chromium. They are interpreter-independent, so one leg
      # covers them; the other legs skip those tests automatically when the
      # browser is absent.
      - name: Cache Playwright browser
        if: matrix.python-version == '3.12'
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('uv.lock') }}
      - name: Install Playwright Chromium
        if: matrix.python-version == '3.12'
        run: uv run playwright install --with-deps chromium

      - name: Test
        run: uv run pytest --cov --cov-report=xml

      # One upload per commit. The legs exercise the same lines, so
      # uploading from all three only makes the reported number depend on
      # how many have finished.
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
