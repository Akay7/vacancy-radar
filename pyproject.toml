[project]
name = "vacancy-radar"
version = "0.1.0"
description = "Paste a job posting — get a match score against your CV, similar past vacancies with outcomes, and a grounded draft opening paragraph."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "chromadb>=1.5.9",
    "sentence-transformers>=5.6.1",
    "anthropic>=0.120.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
    "langchain-core>=1.5.3",
    "langchain-text-splitters>=1.1.2",
    "langchain-anthropic>=1.5.3",
    "langchain-ollama>=1.1.0",
    "langchain-chroma>=1.1.0",
    "langchain-huggingface>=1.2.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "reportlab>=5.0.0",
]

[project.scripts]
vacancy-radar = "vacancy_radar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vacancy_radar"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File"]

[tool.pytest.ini_options]
testpaths = ["tests"]
