[project]
name = "vacancy-radar"
version = "0.2.0"
description = "Local-first job application tracker with hybrid search and an MCP server."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Egor Poderiagin", email = "egor@crazyrussian.pro" },
]
keywords = [
    "job-search",
    "job-tracker",
    "markdown",
    "mcp",
    "hybrid-search",
    "lancedb",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "typer>=0.27.1",
    "rich>=15.0.0",
    "pydantic>=2.13.4",
    "ruamel.yaml>=0.19.1",
    "text-unidecode>=1.3",
    "lancedb>=0.36.0",
    "fastembed>=0.8.0",
    "pypdf>=6.14.2",
    "fastmcp[apps]>=4.0.0b5",
]

[project.urls]
Homepage = "https://github.com/Akay7/vacancy-radar"
Repository = "https://github.com/Akay7/vacancy-radar"
Issues = "https://github.com/Akay7/vacancy-radar/issues"

[project.scripts]
vacancy-radar = "vacancy_radar.cli:app"
vacancy-radar-mcp = "vacancy_radar.mcp_server:main"

[dependency-groups]
dev = [
    # Headless-Chromium render tests for the MCP Apps `ui://` views
    # (tests/test_mcp_ui_views.py). Needs `playwright install chromium`
    # once; the tests skip cleanly when that browser is absent.
    "playwright>=1.62",
    "pre-commit>=4.0.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    # Keep in lockstep with the ruff-pre-commit rev in
    # .pre-commit-config.yaml - the hook builds its own env, so a lower
    # floor here lets the CLI and the commit hook lint at different
    # versions, and `select = ["ALL"]` makes new releases add rules.
    "ruff>=0.16.2",
]

[build-system]
# >=1.27 emits PEP 639 metadata: `license = "MIT"` as License-Expression
# and `license-files` into .dist-info/licenses/.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vacancy_radar"]

# Explicit, or hatchling sweeps in every non-gitignored path at the repo
# root - agent tooling, .opencode/node_modules, editor config - and the
# sdist becomes megabytes of things nobody installing this needs.
[tool.hatch.build.targets.sdist]
# Leading slashes anchor at the repo root - unanchored, `tests` and
# `LICENSE` also match those names nested anywhere below it.
include = [
    "/src/vacancy_radar",
    "/tests",
    "/eval",
    "/docs",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # docstrings not required for this stage
    "COM812",  # trailing-comma rule conflicts with the formatter
    "CPY001",  # no per-file copyright headers; LICENSE covers it
    "INP001",  # tests/ is a deliberately flat, package-less pytest layout
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is expected in tests
"tests/fixtures/generate.py" = ["S311"]  # seeded PRNG for deterministic fixtures, not crypto
"tests/fixtures/pdfs.py" = ["S106", "S107"]  # test-fixture PDF passwords, not real secrets
"tests/fixtures/test_pdfs.py" = ["S106"]  # test-fixture PDF password, not a real secret

# Bare `--cov` in CI measures whatever this names; without it, coverage
# also reports on tests/ and site-packages.
[tool.coverage.run]
source = ["src/vacancy_radar"]
# Configured here rather than as `--cov-branch` on the CI command line so
# a local `pytest --cov` measures the same thing CI does. Counts each
# outgoing edge of a conditional, not just whether the line ran - an
# untaken `if` -> skip edge is a partial, which line coverage calls done.
branch = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "embedding: loads and runs the real fastembed model (downloads on first run; cache across CI runs by model name)",
]
