services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # `z` relabels the bind mount for SELinux (Fedora/RHEL hosts running Podman would
      # otherwise deny the container access); it is a documented no-op elsewhere.
      # read-write: specs/006-vacancy-upload writes new vacancy folders here (confirmed uploads)
      - ./data/user:/data/user:z
      - ./data/example:/data/example:ro,z
      - ./.cache:/app/.cache:z

  # Set LLM_PROVIDER=ollama LLM_MODEL=<model> in .env to use this instead of a hosted provider
  ollama:
    image: docker.io/ollama/ollama:latest
    profiles: ["local"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  ollama-data:
