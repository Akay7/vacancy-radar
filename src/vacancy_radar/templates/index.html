<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vacancy Radar</title>
  <script src="/static/htmx.min.js"></script>
  <script src="/static/ui.js" defer></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    textarea { width: 100%; min-height: 220px; font-family: inherit; font-size: 1rem; padding: 0.6rem; box-sizing: border-box; }
    button { font-size: 1rem; padding: 0.5rem 1.2rem; margin-top: 0.5rem; }
    #spinner { display: none; margin-left: 0.6rem; }
    #spinner.htmx-request { display: inline; }
  </style>
</head>
<body>
  <h1>Vacancy Radar</h1>
  <p>Paste a job posting below to see your match report.</p>

  <form hx-post="/ui/analyze" hx-target="#result" hx-swap="innerHTML" hx-indicator="#spinner">
    <textarea name="jd_text" placeholder="Paste the job posting text here..."></textarea>
    <div>
      <button type="submit" hx-disabled-elt="this">Analyze</button>
      <span id="spinner">Analyzing…</span>
    </div>
  </form>

  <div id="result"></div>
</body>
</html>
