{% extends "_layout.html" %}

{% block content %}
<h1>Vacancy Radar</h1>
<p>Paste a job posting below, or upload its document (image, PDF, DOCX, or text) to see your
  match report — uploading also drafts company/position/date so you can log it right here.</p>

<form hx-post="/analyze" hx-target="#result" hx-swap="innerHTML" hx-indicator="#spinner"
      hx-encoding="multipart/form-data">
  <textarea name="jd_text" placeholder="Paste the job posting text here..."></textarea>
  <input type="file" name="file" />
  <div>
    <button type="submit" hx-disabled-elt="this">Analyze</button>
    <span id="spinner">Analyzing…</span>
  </div>
</form>

<div id="result"></div>
{% endblock %}
