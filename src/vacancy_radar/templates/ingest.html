{% extends "_layout.html" %}

{% block content %}
<div data-step="upload">
  <h1>Log a vacancy</h1>
  <p>Upload a job posting or offer document — image, PDF, DOCX, or plain text.</p>

  <form hx-post="/ingest/draft" hx-target="#result" hx-swap="innerHTML"
        hx-encoding="multipart/form-data" hx-indicator="#ingest-spinner">
    <input type="file" name="file" required />
    <button type="submit" hx-disabled-elt="this">Draft vacancy</button>
    <span id="ingest-spinner">Drafting…</span>
  </form>

  <div id="result"></div>
</div>
{% endblock %}
