# Stage 5's labelled query set, run against the committed fixture vault
# (tests/fixtures/vault). Every expected_doc_ids entry must exist as a
# doc_id in the index built from that vault - tests/eval/test_queries.py
# fails the suite if any goes stale.
#
# Never written against real vacancy data; no real company name appears
# here. Vacancy-row hits use the "vacancy:<vacancy_id>" doc_id build.py
# assigns to denormalized vacancy rows; document hits use the document's
# own id.

- id: exact-name-sample-solutions
  query: "Sample Solutions"
  expected_doc_ids:
    - "vacancy:2022-08-05-sample-solutions-engineering-manager"
  category: exact_name
  note: >-
    Company name unique to a single fixture vacancy; keyword mode should
    dominate on an exact proper noun.

