- id: paraphrase-distributed-consensus-1
  query: >-
    How capably did the applicant perform when explaining how a
    company's information gets split across many machines and kept
    consistent with each other throughout their face-to-face meetings?
  expected_doc_ids:
    - "search-fixture-paraphrase-doc1"
  category: paraphrase
  note: >-
    Stage 4's SEMANTIC_PARAPHRASE_QUERY verbatim; shares no content word
    with its target's domain-specific phrasing.

- id: paraphrase-distributed-consensus-2
  query: >-
    Was the person being evaluated skilled at agreeing on shared data
    across many separate servers while dividing large datasets into
    pieces, based on what was seen in their face-to-face meeting?
  expected_doc_ids:
    - "search-fixture-paraphrase-doc1"
  category: paraphrase
  note: >-
    A second, independently-worded paraphrase of the same target
    document, verified content-word-free by test.

- id: paraphrase-distributed-consensus-3
  query: >-
    How well could the applicant describe methods computers use to stay
    in agreement with one another and break a large collection of
    records into smaller chunks spread across machines?
  expected_doc_ids:
    - "search-fixture-paraphrase-doc1"
  category: paraphrase
  note: >-
    A third independently-worded paraphrase of the same target
    document.

- id: paraphrase-distributed-consensus-4
  query: >-
    During their face-to-face session, how effectively did the person
    show they understood keeping copies of data in sync across a
    network and dividing a big dataset among several computers?
  expected_doc_ids:
    - "search-fixture-paraphrase-doc1"
  category: paraphrase
  note: >-
    A fourth independently-worded paraphrase of the same target
    document. The fixture generator has only one distinctive paraphrase
    target, so this category measures semantic consistency across
    differently-worded queries against it rather than diversity of
    targets - see design.md.

- id: temporal-acme-corp-applied
  query: "Which Acme Corp opportunity have I already applied to?"
  expected_doc_ids:
    - "vacancy:2024-12-14-acme-corp-frontend-developer"
  category: temporal
  note: >-
    Raw dates aren't part of indexed text, so recency phrasing is
    disambiguated via status (applied) rather than a literal date - the
    vault's real temporal signal (see design.md).

